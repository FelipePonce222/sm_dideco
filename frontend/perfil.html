<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Monitoreo DIDECO</title>
    <link rel="icon" type="image/png" href="./assets/logo_muni.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Todos los estilos cargados limpiamente desde el CSS externo -->
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-light">

    <!-- Navbar con el verde municipal -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-muni shadow-sm px-4">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="./index.html">
                <img src="./assets/Logo_MLG.png" alt="Logo" height="40" class="bg-white p-1 rounded">
                <span class="fw-bold">| Sistema Monitoreo Municipal</span>
            </a>
            <div class="d-flex align-items-center gap-3 text-white">
                <span>Hola, <strong id="user-greeting-name">Cargando...</strong></span>
                <a href="./index.html" class="btn btn-outline-light btn-sm rounded-pill px-3 fw-semibold">
                    <i class="bi bi-house-door-fill me-1"></i> Inicio
                </a>
                <button class="btn btn-light text-danger btn-sm rounded-pill px-3 fw-semibold" id="btn-logout">
                    <i class="bi bi-box-arrow-right me-1"></i> Salir
                </button>
            </div>
        </div>
    </nav>

    <!-- Contenido Perfil -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <!-- Card Principal -->
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    <!-- Banner superior institucional -->
                    <div class="bg-muni text-white p-4 d-flex align-items-center justify-content-between">
                        <div>
                            <h2 class="h4 mb-0 fw-bold">Perfil del Funcionario</h2>
                            <p class="small text-white-50 mb-0">Información institucional registrada</p>
                        </div>
                        <span class="badge bg-white text-success fs-6 px-3 py-2 rounded-pill fw-bold shadow-sm">
                            <i class="bi bi-check-circle-fill text-muni me-1"></i> Activo
                        </span>
                    </div>

                    <div class="card-body p-4 p-md-5">
                        <div class="row align-items-center mb-4">
                            <!-- Avatar con las iniciales y fondo institucional -->
                            <div class="col-md-4 text-center mb-3 mb-md-0">
                                <div class="position-relative d-inline-block">
                                    <img src="https://ui-avatars.com/api/?name=Usuario&size=150&background=3d9735&color=fff" 
                                         id="profile-avatar" 
                                         class="rounded-circle img-thumbnail shadow-sm border-muni" 
                                         alt="Foto de perfil" style="width: 140px; height: 140px; object-fit: cover;">
                                </div>
                            </div>
                            
                            <!-- Nombre y Correo -->
                            <div class="col-md-8 text-center text-md-start">
                                <span class="text-muted text-uppercase small fw-bold tracking-wider">Nombre Completo</span>
                                <h3 class="fw-bold text-dark mb-1" id="profile-nombre">Cargando...</h3>
                                <p class="text-muni fw-semibold mb-2" id="profile-correo"><i class="bi bi-envelope me-1"></i> -</p>
                                <span class="badge bg-light text-dark border px-3 py-1 fw-normal" id="profile-rut">
                                    <i class="bi bi-card-heading me-1"></i> RUT: -
                                </span>
                            </div>
                        </div>

                        <hr class="my-4 text-secondary opacity-25">

                        <!-- Detalles Organizacionales -->
                        <div class="row g-3">
                            <div class="col-md-6">
                                <div class="p-3 border rounded-3 bg-light border-start border-4 border-muni">
                                    <small class="text-muted d-block fw-semibold mb-1">UNIDAD</small>
                                    <span class="fw-bold text-dark fs-6" id="profile-unidad">Franja 1</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="p-3 border rounded-3 bg-light border-start border-4 border-muni">
                                    <small class="text-muted d-block fw-semibold mb-1">DEPARTAMENTO / SUBDIRECCIÓN</small>
                                    <span class="fw-bold text-dark fs-6" id="profile-depto">Participación Comunitaria</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="p-3 border rounded-3 bg-light border-start border-4 border-muni">
                                    <small class="text-muted d-block fw-semibold mb-1">TIPO DE CONTRATO</small>
                                    <span class="fw-bold text-dark fs-6" id="profile-contrato">Honorario</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="p-3 border rounded-3 bg-light border-start border-4 border-muni">
                                    <small class="text-muted d-block fw-semibold mb-1">ROL DE SISTEMA</small>
                                    <span class="fw-bold text-dark fs-6" id="profile-rol">Funcionario DIDECO</span>
                                </div>
                            </div>
                        </div>

                        <!-- Botón de acción -->
                        <div class="mt-4 pt-2 text-end">
                            <button class="btn btn-muni px-4 py-2 rounded-3 fw-bold shadow-sm" id="btn-editar">
                                <i class="bi bi-pencil-square me-1"></i> Solicitud de Actualización
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="./js/perfil.js"></script>
</body>
</html>
