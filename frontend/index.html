<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Monitoreo Municipal</title>
    <link rel="icon" type="image/png" href="./assets/logo_muni.png">    
<!-- Ruta explícita al CSS -->
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <header class="navbar">
        <div class="logo-container">
        <img src="./assets/logo_muni.png" alt="Logo Municipalidad" height="32">
        <span class="brand-title">Sistema Monitoreo Municipal</span>
    </div>
        <div class="user-menu">
            <span class="user-greeting">Hola, <strong>Patricia V.</strong></span>
            <button class="btn-menu">Menú</button>
        </div>
    </header>

    <main class="main-content">
        <!-- SECCIÓN KPI DASHBOARD -->
        <section class="dashboard-section">
            <h2>Dashboard de Operaciones en Terreno</h2>
            <div class="kpi-grid">
                <div class="kpi-card">
                    <span class="kpi-title">Total Personal</span>
                    <span class="kpi-value" id="kpi-personal">40</span>
                </div>
                <div class="kpi-card">
                    <span class="kpi-title">Marcas</span>
                    <span class="kpi-value" id="kpi-marcas">35</span>
                </div>
                <div class="kpi-card">
                    <span class="kpi-title">Tareas de hoy</span>
                    <span class="kpi-value" id="kpi-tareas">20</span>
                </div>
                <div class="kpi-card">
                    <span class="kpi-title">Avance</span>
                    <span class="kpi-value" id="kpi-avance">68%</span>
                </div>
            </div>
        </section>

        <!-- SECCIÓN TABLA ACTIVIDADES -->
        <section class="table-section">
            <h3>Resumen de Actividades recientes</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Funcionario</th>
                            <th>Tarea</th>
                            <th>Unidad</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-actividades">
                        <!-- Carga dinámica vía JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Ruta explícita al JS -->
    <script src="./js/app.js"></script>
</body>
</html>
